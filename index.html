<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ ZUBI Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #0F0F1A;
            color: #F8FAFC;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: #1A1A2E;
            padding: 20px 20px 16px;
            border-radius: 16px;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .header h1 span.purple { color: #9F5FFB; }
        .header h1 span.pink { color: #EC4899; }

        .header p {
            color: #94A3B8;
            font-size: 13px;
        }

        /* Card */
        .card {
            background: #1A1A2E;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }

        /* URL Input */
        .url-label {
            color: #9F5FFB;
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .url-input-wrapper {
            position: relative;
        }

        .url-input {
            width: 100%;
            padding: 14px 16px;
            background: #252540;
            border: 2px solid transparent;
            border-radius: 12px;
            color: #F8FAFC;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .url-input:focus {
            border-color: #9F5FFB;
        }

        .url-input::placeholder {
            color: #64748B;
        }

        /* Platform Buttons */
        .platform-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .platform-btn {
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .platform-btn:active {
            transform: scale(0.95);
        }

        .platform-btn.tiktok { background: #010101; }
        .platform-btn.instagram { background: #E1306C; }
        .platform-btn.facebook { background: #1877F2; }

        /* Download Button */
        .download-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #7C3AED, #9F5FFB);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Progress */
        .progress-container {
            margin-top: 12px;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-text {
            color: #94A3B8;
            font-size: 12px;
            text-align: center;
            margin-bottom: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #252540;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #7C3AED, #EC4899);
            width: 0%;
            transition: width 0.3s;
            border-radius: 4px;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .stat-card {
            background: #252540;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-number {
            color: #9F5FFB;
            font-size: 18px;
            font-weight: bold;
        }

        .stat-label {
            color: #94A3B8;
            font-size: 11px;
            margin-top: 2px;
        }

        /* Log */
        .log-container {
            background: #1A1A2E;
            border-radius: 16px;
            padding: 12px 16px;
            margin-top: 12px;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-title {
            color: #9F5FFB;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .log-entry {
            font-size: 12px;
            padding: 4px 0;
            border-bottom: 1px solid #252540;
            color: #94A3B8;
            animation: fadeIn 0.3s;
        }

        .log-entry.success { color: #10B981; }
        .log-entry.error { color: #EF4444; }
        .log-entry.info { color: #06B6D4; }
        .log-entry.warning { color: #F59E0B; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .log-entry .timestamp {
            color: #475569;
            margin-right: 8px;
        }

        /* Files Button */
        .files-btn {
            width: 100%;
            padding: 14px;
            background: #1A1A2E;
            border: 1px solid #252540;
            border-radius: 12px;
            color: #06B6D4;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .files-btn:active {
            background: #252540;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1A1A2E;
            color: #F8FAFC;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            border: 1px solid #252540;
            display: none;
            z-index: 1000;
            animation: slideUp 0.3s;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            display: block;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* Scrollbar */
        .log-container::-webkit-scrollbar {
            width: 4px;
        }

        .log-container::-webkit-scrollbar-track {
            background: #252540;
            border-radius: 2px;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: #7C3AED;
            border-radius: 2px;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .platform-grid {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <span class="purple">⚡ ZUBI</span>
                <span class="pink">Downloader</span>
            </h1>
            <p>🎵 TikTok • 📸 Instagram • 👍 Facebook • No Watermark</p>
        </div>

        <!-- URL Input -->
        <div class="card">
            <label class="url-label">📎 Paste video link</label>
            <div class="url-input-wrapper">
                <input type="text" id="urlInput" class="url-input"
                       placeholder="https://www.tiktok.com/... or Instagram/Facebook link"
                       autocomplete="off">
            </div>
        </div>

        <!-- Platform Buttons -->
        <div class="platform-grid">
            <button class="platform-btn tiktok" onclick="setPlatform('tiktok')">🎵 TikTok</button>
            <button class="platform-btn instagram" onclick="setPlatform('instagram')">📸 Instagram</button>
            <button class="platform-btn facebook" onclick="setPlatform('facebook')">👍 Facebook</button>
        </div>

        <!-- Download Button -->
        <button class="download-btn" id="downloadBtn" onclick="startDownload()">
            ⬇ Download Video
        </button>

        <!-- Progress -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-text" id="progressText">Starting...</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="statCount">0</div>
                <div class="stat-label">Downloaded</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statSize">0 MB</div>
                <div class="stat-label">Total Size</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="statFolder">📁</div>
                <div class="stat-label">Folder</div>
            </div>
        </div>

        <!-- Log -->
        <div class="log-container" id="logContainer">
            <div class="log-title">📋 Activity Log</div>
            <div id="logEntries">
                <div class="log-entry info">
                    <span class="timestamp">⚡</span> ZUBI Downloader ready!
                </div>
            </div>
        </div>

        <!-- Files Button -->
        <button class="files-btn" onclick="showFiles()">📂 View Downloaded Files</button>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ── State ──────────────────────────────────────────────────────────────
        let currentPlatform = null;
        let isDownloading = false;
        let downloadHistory = [];
        let totalSize = 0;

        // ── DOM Refs ──────────────────────────────────────────────────────────
        const urlInput = document.getElementById('urlInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const logEntries = document.getElementById('logEntries');
        const statCount = document.getElementById('statCount');
        const statSize = document.getElementById('statSize');
        const toast = document.getElementById('toast');

        // ── Logging ──────────────────────────────────────────────────────────
        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="timestamp">${time}</span> ${message}`;
            logEntries.appendChild(entry);
            logEntries.scrollTop = logEntries.scrollHeight;
        }

        // ── Toast ──────────────────────────────────────────────────────────────
        function showToast(message, duration = 3000) {
            toast.textContent = message;
            toast.className = 'toast show';
            clearTimeout(toast._hide);
            toast._hide = setTimeout(() => {
                toast.className = 'toast';
            }, duration);
        }

        // ── Set Platform ─────────────────────────────────────────────────────
        function setPlatform(platform) {
            currentPlatform = platform;
            const names = { tiktok: 'TikTok', instagram: 'Instagram', facebook: 'Facebook' };
            showToast(`📱 ${names[platform]} selected`, 1500);
            log(`Selected platform: ${names[platform]}`, 'info');
        }

        // ── Progress ──────────────────────────────────────────────────────────
        function setProgress(percent, text) {
            progressFill.style.width = `${Math.min(percent, 100)}%`;
            progressText.textContent = text || `${Math.round(percent)}%`;
            if (percent > 0 && percent < 100) {
                progressContainer.className = 'progress-container active';
            }
        }

        function hideProgress() {
            progressContainer.className = 'progress-container';
            progressFill.style.width = '0%';
        }

        // ── Detect Platform ──────────────────────────────────────────────────
        function detectPlatform(url) {
            const u = url.toLowerCase();
            if (u.includes('tiktok.com') || u.includes('vm.tiktok') || u.includes('vt.tiktok')) return 'tiktok';
            if (u.includes('instagram.com') || u.includes('instagr.am')) return 'instagram';
            if (u.includes('facebook.com') || u.includes('fb.watch') || u.includes('fb.com')) return 'facebook';
            return null;
        }

        // ── API Calls ──────────────────────────────────────────────────────────
        async function downloadTikTok(url, onProgress) {
            try {
                // Using TikWM API (free)
                const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`;
                const response = await fetch(apiUrl);
                const data = await response.json();

                if (data.code === 0 && data.data) {
                    const videoUrl = data.data.hdplay || data.data.play;
                    if (videoUrl) {
                        const title = data.data.title || 'TikTok Video';
                        const author = data.data.author?.unique_id || 'unknown';
                        log(`🎵 Found: ${title.substring(0, 40)}...`, 'info');
                        return await downloadFile(videoUrl, `ZUBI_TikTok_${Date.now()}.mp4`, onProgress);
                    }
                }
                throw new Error('No video found');
            } catch (e) {
                log('TikWM failed, trying alternative...', 'warning');
                // Fallback: Try snaptik
                return await downloadTikTokFallback(url, onProgress);
            }
        }

        async function downloadTikTokFallback(url, onProgress) {
            try {
                const response = await fetch('https://snaptik.app/abc2.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `url=${encodeURIComponent(url)}&lang=en`
                });
                const html = await response.text();
                const match = html.match(/href="(https?:\/\/[^"]+\.mp4[^"]*)"/);
                if (match) {
                    return await downloadFile(match[1], `ZUBI_TikTok_${Date.now()}.mp4`, onProgress);
                }
                throw new Error('No video found');
            } catch (e) {
                throw new Error('All TikTok download methods failed');
            }
        }

        async function downloadInstagram(url, onProgress) {
            try {
                // Using snapinsta API
                const response = await fetch('https://snapinsta.app/action.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `url=${encodeURIComponent(url)}&lang=en&token=abc123`
                });
                const text = await response.text();
                const match = text.match(/href="(https?:\/\/[^"]+\.mp4[^"]*)"/);
                if (match) {
                    return await downloadFile(match[1], `ZUBI_Instagram_${Date.now()}.mp4`, onProgress);
                }
                throw new Error('No video found');
            } catch (e) {
                throw new Error('Instagram download failed');
            }
        }

        async function downloadFacebook(url, onProgress) {
            try {
                const response = await fetch('https://getfvid.com/downloader', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `url=${encodeURIComponent(url)}`
                });
                const html = await response.text();
                const hdMatch = html.match(/href="(https?:\/\/[^"]+)"[^>]*>HD/i);
                const sdMatch = html.match(/href="(https?:\/\/[^"]+\.mp4[^"]*)"/);
                const match = hdMatch || sdMatch;
                if (match) {
                    return await downloadFile(match[1], `ZUBI_Facebook_${Date.now()}.mp4`, onProgress);
                }
                throw new Error('No video found');
            } catch (e) {
                throw new Error('Facebook download failed');
            }
        }

        // ── Download File ─────────────────────────────────────────────────────
        async function downloadFile(url, filename, onProgress) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network error');

                const contentLength = response.headers.get('content-length');
                const total = parseInt(contentLength, 10);

                const reader = response.body.getReader();
                const chunks = [];
                let loaded = 0;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    chunks.push(value);
                    loaded += value.length;

                    if (total && onProgress) {
                        onProgress((loaded / total) * 100);
                    }
                }

                const blob = new Blob(chunks);
                const size = blob.size / (1024 * 1024);

                // Save file
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Update history
                downloadHistory.push({ filename, size });
                totalSize += blob.size;
                updateStats();

                return { success: true, size, filename };
            } catch (e) {
                throw new Error(`Download failed: ${e.message}`);
            }
        }

        // ── Start Download ────────────────────────────────────────────────────
        async function startDownload() {
            if (isDownloading) {
                showToast('⚠ Download already in progress!', 2000);
                return;
            }

            const url = urlInput.value.trim();
            if (!url) {
                showToast('✗ Paste a video link first!', 2000);
                return;
            }

            let platform = currentPlatform || detectPlatform(url);
            if (!platform) {
                showToast('✗ Unknown platform. Select one or use TikTok/Instagram/Facebook URL', 3000);
                return;
            }

            const platformNames = {
                tiktok: 'TikTok',
                instagram: 'Instagram',
                facebook: 'Facebook'
            };

            isDownloading = true;
            downloadBtn.disabled = true;
            downloadBtn.innerHTML = '⏳ Downloading...';
            showToast(`📥 Starting download from ${platformNames[platform]}`, 2000);
            log(`▶ [${platformNames[platform]}] Starting download...`, 'info');

            try {
                let result;
                const progressCallback = (pct) => {
                    setProgress(pct, `Downloading... ${Math.round(pct)}%`);
                };

                switch (platform) {
                    case 'tiktok':
                        result = await downloadTikTok(url, progressCallback);
                        break;
                    case 'instagram':
                        result = await downloadInstagram(url, progressCallback);
                        break;
                    case 'facebook':
                        result = await downloadFacebook(url, progressCallback);
                        break;
                    default:
                        throw new Error('Unsupported platform');
                }

                if (result && result.success) {
                    setProgress(100, '✅ Download complete!');
                    log(`✓ Downloaded: ${result.filename} (${result.size.toFixed(1)} MB)`, 'success');
                    showToast(`✅ Downloaded successfully!`, 3000);
                    urlInput.value = '';
                } else {
                    throw new Error('Download failed');
                }
            } catch (error) {
                log(`✗ Error: ${error.message}`, 'error');
                showToast(`✗ ${error.message}`, 3000);
                hideProgress();
            }

            isDownloading = false;
            downloadBtn.disabled = false;
            downloadBtn.innerHTML = '⬇ Download Video';
        }

        // ── Stats ─────────────────────────────────────────────────────────────
        function updateStats() {
            statCount.textContent = downloadHistory.length;
            const totalMB = totalSize / (1024 * 1024);
            statSize.textContent = totalMB < 1 ? `${(totalMB * 1024).toFixed(0)} KB` : `${totalMB.toFixed(0)} MB`;
            statFolder.textContent = '📁 ZUBI';
        }

        // ── Show Files ────────────────────────────────────────────────────────
        function showFiles() {
            if (downloadHistory.length === 0) {
                showToast('📭 No files downloaded yet!', 2000);
                log('📭 No files in history', 'warning');
                return;
            }

            log('📂 Downloaded Files:', 'info');
            downloadHistory.forEach((file, i) => {
                const size = file.size < 1 ? `${(file.size * 1024).toFixed(0)} KB` : `${file.size.toFixed(1)} MB`;
                log(`  ${i + 1}. ${file.filename} (${size})`, 'info');
            });
        }

        // ── Keyboard Shortcut ────────────────────────────────────────────────
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                startDownload();
            }
        });

        // ── Auto-detect on paste ─────────────────────────────────────────────
        urlInput.addEventListener('input', () => {
            const url = urlInput.value.trim();
            if (url) {
                const platform = detectPlatform(url);
                if (platform) {
                    currentPlatform = platform;
                    const names = { tiktok: '🎵 TikTok', instagram: '📸 Instagram', facebook: '👍 Facebook' };
                    // Just update UI hint
                }
            }
        });

        // ── Init ──────────────────────────────────────────────────────────────
        log('⚡ ZUBI Downloader ready!', 'info');
        log('💡 Paste link and click Download', 'info');
        updateStats();

        console.log('%c⚡ ZUBI Downloader', 'font-size:20px; color:#9F5FFB; font-weight:bold;');
        console.log('%c🎵 TikTok • 📸 Instagram • 👍 Facebook', 'font-size:14px; color:#94A3B8;');
    </script>

</body>
</html>
