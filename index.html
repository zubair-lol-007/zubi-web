<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZUBI Downloader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0F0F1A;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: #1A1A2E;
            padding: 24px;
            border-radius: 20px;
        }
        h1 {
            font-size: 28px;
            text-align: center;
            margin-bottom: 5px;
        }
        .purple { color: #9F5FFB; }
        .pink { color: #EC4899; }
        .sub {
            text-align: center;
            color: #94A3B8;
            font-size: 13px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #252540;
            border: 2px solid #333;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            margin-bottom: 12px;
        }
        input:focus { border-color: #9F5FFB; }
        .platforms {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }
        .plat-btn {
            padding: 10px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .tiktok { background: #000; }
        .instagram { background: #E1306C; }
        .facebook { background: #1877F2; }
        .download-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #7C3AED, #9F5FFB);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .download-btn:disabled { opacity: 0.5; }
        .log {
            background: #0F0F1A;
            padding: 12px;
            border-radius: 10px;
            margin-top: 12px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
        }
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #252540;
            color: #94A3B8;
        }
        .success { color: #10B981; }
        .error { color: #EF4444; }
        .info { color: #06B6D4; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1A1A2E;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid #333;
            display: none;
            z-index: 999;
        }
        .toast.show { display: block; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 12px 0;
        }
        .stat {
            background: #252540;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-num { color: #9F5FFB; font-size: 18px; font-weight: bold; }
        .stat-label { color: #94A3B8; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <h1><span class="purple">⚡ ZUBI</span> <span class="pink">Downloader</span></h1>
    <div class="sub">🎵 TikTok • 📸 Instagram • 👍 Facebook</div>

    <input type="text" id="urlInput" placeholder="Paste video link here...">

    <div class="platforms">
        <button class="plat-btn tiktok" onclick="setPlat('tiktok')">🎵 TikTok</button>
        <button class="plat-btn instagram" onclick="setPlat('instagram')">📸 Instagram</button>
        <button class="plat-btn facebook" onclick="setPlat('facebook')">👍 Facebook</button>
    </div>

    <button class="download-btn" id="downloadBtn" onclick="startDownload()">⬇ Download Video</button>

    <div class="stats">
        <div class="stat"><div class="stat-num" id="count">0</div><div class="stat-label">Downloaded</div></div>
        <div class="stat"><div class="stat-num" id="size">0 MB</div><div class="stat-label">Total Size</div></div>
        <div class="stat"><div class="stat-num">📁</div><div class="stat-label">Gallery</div></div>
    </div>

    <div class="log" id="logContainer">
        <div class="log-entry info">⚡ ZUBI Downloader ready!</div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────
let platform = null;
let downloading = false;
let history = [];
let totalSize = 0;
const isAndroid = /android/i.test(navigator.userAgent);

// ── DOM ─────────────────────────────────────────
const urlInput = document.getElementById('urlInput');
const downloadBtn = document.getElementById('downloadBtn');
const logContainer = document.getElementById('logContainer');
const toast = document.getElementById('toast');
const countEl = document.getElementById('count');
const sizeEl = document.getElementById('size');

// ── HELPERS ─────────────────────────────────────
function log(msg, type = 'info') {
    const div = document.createElement('div');
    div.className = `log-entry ${type}`;
    div.textContent = msg;
    logContainer.appendChild(div);
    logContainer.scrollTop = logContainer.scrollHeight;
}

function showToast(msg) {
    toast.textContent = msg;
    toast.className = 'toast show';
    clearTimeout(toast._hide);
    toast._hide = setTimeout(() => { toast.className = 'toast'; }, 3000);
}

function setPlat(p) {
    platform = p;
    const names = { tiktok: 'TikTok', instagram: 'Instagram', facebook: 'Facebook' };
    showToast(`📱 ${names[p]} selected`);
    log(`Selected: ${names[p]}`, 'info');
}

function detectPlatform(url) {
    const u = url.toLowerCase();
    if (u.includes('tiktok.com') || u.includes('vm.tiktok')) return 'tiktok';
    if (u.includes('instagram.com') || u.includes('instagr.am')) return 'instagram';
    if (u.includes('facebook.com') || u.includes('fb.watch')) return 'facebook';
    return null;
}

function updateStats() {
    countEl.textContent = history.length;
    const mb = totalSize / (1024 * 1024);
    sizeEl.textContent = mb < 1 ? `${(mb*1024).toFixed(0)} KB` : `${mb.toFixed(0)} MB`;
}

// ═══════════════════════════════════════════════
// ║  🔥 FIXED DOWNLOAD - GALLERY SAVE
// ═══════════════════════════════════════════════

async function downloadFile(url, filename) {
    try {
        log(`📥 Downloading...`, 'info');
        
        const response = await fetch(url);
        const blob = await response.blob();
        const size = blob.size / (1024 * 1024);
        
        // ── ANDROID APK ──────────────────────────
        if (isAndroid) {
            // 🔥 METHOD 1: Share API (Auto Gallery)
            try {
                if (navigator.share) {
                    const file = new File([blob], filename, { type: 'video/mp4' });
                    await navigator.share({
                        title: 'ZUBI Downloader',
                        files: [file]
                    });
                    showToast('✅ Video saved to Gallery!');
                    log(`✅ ${filename} saved to Gallery!`, 'success');
                    history.push({ name: filename, size: size });
                    totalSize += blob.size;
                    updateStats();
                    return true;
                }
            } catch(e) {}
            
            // 🔥 METHOD 2: Direct Download
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            a.click();
            
            showToast('✅ Downloaded! Check Downloads folder');
            log(`✅ ${filename} saved to Downloads`, 'success');
            log('📍 Move to Gallery: Files → Downloads → Share → Save', 'info');
            
            history.push({ name: filename, size: size });
            totalSize += blob.size;
            updateStats();
            return true;
        }
        
        // ── DESKTOP ──────────────────────────────
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        showToast('✅ Download started!');
        return true;
        
    } catch(e) {
        log(`❌ Error: ${e.message}`, 'error');
        showToast(`❌ ${e.message}`);
        return false;
    }
}

// ── API CALLS ────────────────────────────────────

async function downloadTikTok(url) {
    try {
        const resp = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`);
        const data = await resp.json();
        if (data.code === 0 && data.data) {
            const videoUrl = data.data.hdplay || data.data.play;
            if (videoUrl) {
                return await downloadFile(videoUrl, `ZUBI_TikTok_${Date.now()}.mp4`);
            }
        }
        // Fallback
        const resp2 = await fetch('https://snaptik.app/abc2.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `url=${encodeURIComponent(url)}&lang=en`
        });
        const html = await resp2.text();
        const match = html.match(/href="(https?:\/\/[^"]+\.mp4[^"]*)"/);
        if (match) {
            return await downloadFile(match[1], `ZUBI_TikTok_${Date.now()}.mp4`);
        }
        throw new Error('No video found');
    } catch(e) {
        throw new Error('TikTok download failed');
    }
}

async function downloadInstagram(url) {
    try {
        const resp = await fetch('https://snapinsta.app/action.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `url=${encodeURIComponent(url)}&lang=en`
        });
        const text = await resp.text();
        const match = text.match(/href="(https?:\/\/[^"]+\.mp4[^"]*)"/);
        if (match) {
            return await downloadFile(match[1], `ZUBI_Instagram_${Date.now()}.mp4`);
        }
        throw new Error('No video found');
    } catch(e) {
        throw new Error('Instagram download failed');
    }
}

async function downloadFacebook(url) {
    try {
        const resp = await fetch('https://getfvid.com/downloader', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `url=${encodeURIComponent(url)}`
        });
        const html = await resp.text();
        const match = html.match(/href="(https?:\/\/[^"]+\.mp4[^"]*)"/);
        if (match) {
            return await downloadFile(match[1], `ZUBI_Facebook_${Date.now()}.mp4`);
        }
        throw new Error('No video found');
    } catch(e) {
        throw new Error('Facebook download failed');
    }
}

// ── START ────────────────────────────────────────

async function startDownload() {
    if (downloading) { showToast('⏳ Already downloading...'); return; }
    
    const url = urlInput.value.trim();
    if (!url) { showToast('✗ Paste a video link!'); return; }
    
    let p = platform || detectPlatform(url);
    if (!p) { showToast('✗ Unknown platform!'); return; }
    
    downloading = true;
    downloadBtn.disabled = true;
    downloadBtn.textContent = '⏳ Downloading...';
    
    try {
        let result;
        switch(p) {
            case 'tiktok': result = await downloadTikTok(url); break;
            case 'instagram': result = await downloadInstagram(url); break;
            case 'facebook': result = await downloadFacebook(url); break;
        }
        if (result) {
            urlInput.value = '';
        }
    } catch(e) {
        log(`❌ ${e.message}`, 'error');
        showToast(`❌ ${e.message}`);
    }
    
    downloading = false;
    downloadBtn.disabled = false;
    downloadBtn.textContent = '⬇ Download Video';
}

// ── KEYBOARD ─────────────────────────────────────
urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') startDownload();
});

// ── INIT ─────────────────────────────────────────
log('⚡ ZUBI Downloader ready!', 'info');
if (isAndroid) {
    log('📱 APK Mode - Save to Gallery using Share!', 'success');
}
updateStats();
</script>

</body>
</html>
